[project]
name = "gaia"
version = "0.1.0"
description = "G.A.I.A. — a private, local, zero-telemetry personal AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai>=2.40.0",
    "pydantic-ai-harness>=0.29.0",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
    "textual>=8.2.8",
]

[project.scripts]
gaia = "gaia.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
memory = [
    "chromadb>=1.5.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/gaia"]

[tool.hatch.build.targets.sdist]
# Keep src/ structure intact so pip can build from sdist
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
