name: Publish to PyPI

on:
  push:
    tags:
      - "v*"  # matches v0.1.0, v1.0.0, etc.
  workflow_dispatch:  # manual trigger for testing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Trusted publishing via PyPI (no API token)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Build sdist
        run: uv build --sdist


      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
